<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>self-agent</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-dot"></span>
            <h1>self-agent</h1>
        </div>

        <div class="sidebar-section">
            <h2>Hosted Apps</h2>
            <ul id="apps-list" class="apps-list"><li class="empty">No apps</li></ul>
        </div>
    </aside>

    <main class="chat">
        <div class="chat-feed" id="chat-feed">
            <div class="empty-state" id="empty-state">
                <h2>What should we change?</h2>
                <p>Ask it to improve its own code and UI, or describe an app to build.</p>
            </div>
        </div>

        <form id="composer" class="composer">
            <div class="mode-switch" role="tablist">
                <button type="button" class="mode-btn active" data-mode="improve" role="tab" aria-selected="true">Improve yourself</button>
                <button type="button" class="mode-btn" data-mode="build" role="tab" aria-selected="false">Build an app</button>
            </div>
            <div class="composer-row">
                <textarea id="composer-input" rows="1" placeholder="Describe how you want the agent's own code/UI to change..."></textarea>
                <button type="submit" id="composer-send" aria-label="Send">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </form>
    </main>
</div>

<script src="./vendor/anime.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
